<!DOCTYPE html>
<html>
<head>
    <title>Tomato AI Treatment System</title>
</head>

<body>

    <h1>Tomato AI Disease Detection System</h1>

    <h3>Cost-Aware Treatment Recommendation</h3>

    <form>

        <label>Crop Name:</label>
        <select name="crop" required>
            <option value="Tomato" selected>Tomato</option>
        </select>

        <br><br>

        <label>Upload Crop Image:</label>
        <input type="file" accept="image/*" required>

        <br><br>

        <label>Farm Size (Acres):</label>
        <input type="number" step="0.1" min="0.1" required>

        <br><br>

        <label>Available Budget (₹):</label>
        <input type="number" min="1" required>

        <br><br>

        <button type="button">Analyze Tomato</button>

    </form>

</body>
</html>
